<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge Animation</title>
    <link rel="stylesheet" href="/var.css">
    <style>
        *,html{
            margin: 0;
            padding: 0;
        }
        .container{
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .wrap{
            width: 30%;
            height: 100px;
            background-color: var(--accent-color);
            box-shadow: var(--secondary-color) 5px 5px 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top-left-radius: 50px;
            border-bottom-right-radius: 50px;
        }
        .wrap>p{
            font-size: 2em;
            color: black;
            font-family: Helvetica;
            font-weight: 600;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="wrap">
            <p>Challenge</p>
        </div>
    </div>
</body>
</html>
