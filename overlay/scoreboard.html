<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard</title>
    <style>
        *,html{
            padding: 0;
            margin: 0;
        }
        .container{
            width: fit-content;
        }
        .time-score{
            background-color: var(--primary-color);
            box-shadow: var(--secondary-color) 5px 5px 0 0;
            width: 320px;
            height: 100px;
            display: flex;
            align-items: center;
            border-top-left-radius: 50px;
            border-bottom-right-radius: 50px;
        }
        .tournament-logo{
            margin-left: 10px;
            background-color: pink;
            width: 80px;
            height: 80px;
            border-radius: 50%;
        }
        .stats{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 210px;
            height: 80px;
            gap: 5px;
        }
        .player-score{
            display: flex;
            flex-direction: row;
            height: 35px;
            width: 190px;
        }
        .playername{
            text-transform: uppercase;
            height: 35px;
            width: 165px;
            background-color: orange;
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            font-family: Helvetica;
            font-weight: 600;
        }
        .score{
            height: 35px;
            width: 35px;
            background-color: white;
            color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Helvetica;
            font-weight: 600;
        }
        .shuttlecock-pointer{
            width: 25px;
            height: 35px;
            padding-left: 2px;
            padding-right: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .shuttlecock-pointer>img{
            width: 20px;
            height: 20px;
        }
    </style>
    <link rel="stylesheet" href="../var.css">
</head>
<body>
    <div class="container">

        <div class="time-score">
            <div class="tournament-logo">

            </div>
            <div class="stats">
                <div class="player-score">
                    <div class="playername" style="background-color: var(--tim-a);" id="scoreboardPlayer1"></div>
                    <div class="shuttlecock-pointer" style="background-color: var(--tim-a);">
                        <img id="shuttlecockPlayer1" src="../assets/img/shuttlecock_icon.png" alt="">
                    </div>
                    <div class="score" id="scoreboardPlayer1Score"></div>
                </div>
                <div class="player-score">
                    <div class="playername" style="background-color: var(--tim-b)" id="scoreboardPlayer2"></div>
                    <div class="shuttlecock-pointer" style="background-color: var(--tim-b);">
                        <img id="shuttlecockPlayer2" src="../assets/img/shuttlecock_icon.png" alt="">
                    </div>
                    <div class="score" style="border-bottom-right-radius: 15px;" id="scoreboardPlayer2Score"></div>
                </div>
                
            </div>
        </div>

    </div>

    <script>

    let playername1 = '';
    let playername2 = '';
    try {
        playername1 = JSON.parse(localStorage.getItem('playername1')).name;
    } catch (e) {}
    try {
        playername2 = JSON.parse(localStorage.getItem('playername2')).name;
    } catch (e) {}

    if(localStorage.getItem('shuttlecockPlayerPointer') === 'Player1') {
        document.getElementById('shuttlecockPlayer1').style.visibility = 'visible';
        document.getElementById('shuttlecockPlayer2').style.visibility = 'hidden';
    } else if (localStorage.getItem('shuttlecockPlayerPointer') === 'Player2') {
        document.getElementById('shuttlecockPlayer1').style.visibility = 'hidden';
        document.getElementById('shuttlecockPlayer2').style.visibility = 'visible';
    } else {
        document.getElementById('shuttlecockPlayer1').style.visibility = 'hidden';
        document.getElementById('shuttlecockPlayer2').style.visibility = 'hidden';
    }

    document.getElementById('scoreboardPlayer1').innerHTML = playername1 || '';
    document.getElementById('scoreboardPlayer2').innerHTML = playername2 || '';
    document.getElementById('scoreboardPlayer1Score').innerHTML = localStorage.getItem('player1Score') || '0';
    document.getElementById('scoreboardPlayer2Score').innerHTML = localStorage.getItem('player2Score') || '0';  

    setInterval(() => {
      location.reload();
    }, 500); // Check every 500ms

    // setInterval(() => {
    // let currentValue = localStorage.getItem("playername2");
    // if (currentValue !== playername2) {
    //   playername2 = currentValue;
    //   location.reload();
    // }
    // }, 500); // Check every 500ms

    </script>
</body>
</html>
