<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction animation</title>
    <link rel="stylesheet" href="../var.css">
    <style>
        *,html{
            margin: 0;
            padding: 0;
        }
        .container{
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .slides-wrap{
            margin-top: -665px;
            /* margin-top: 65px; */
            width: 100%;
            height: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #cccccc3a;
            /* background-color: tomato; */
        }
        .slide{
            width: 90%;
            height: 90%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            /* background-color: var(--primary-color-transparent); */
            gap: 45px;
        }

        .slides-animation{
            animation: slideAnimation 15s normal forwards;
        }
        .paddinguplogos{
            animation: paddinguplogos 15s normal forwards;
        } 
        .makeSlideWrapContentHigher{
            animation: makeSlideWrapContentHigher 15s normal forwards;
        }
        .makeImagesBigger{
            animation: makeImagesBigger 15s normal forwards;
        }
        .slide-wrap-content{
            width: 45%;
            height: 85%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            box-shadow: rgba(0, 0, 0, 0.4) 15px 15px 0 0;
            color: rgb(37, 37, 37);
            border-bottom-left-radius: 60px;
            border-top-right-radius: 60px;
            /* background-color: var(--accent-color); */
        }
        #slide1Content, #slide2Content{
            font-size: 2.5em;
            font-weight: 600;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            /* background-color: aquamarine; */
        }
        .slideImage{
            width: 100%;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .slideImageIMG{
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @keyframes slideAnimation {
            0% { transform: translateY(0); padding: 0;}
            20% { transform: translateY(580px); padding: 0;}
            25% { transform: translateY(680px); padding: 0;}
            45% { transform: translateY(800px); padding-bottom: 7%; padding-top: 7%;}
            50% { transform: translateY(800px); padding-bottom: 7%; padding-top: 7%;}
            70% { transform: translateY(800px); padding-bottom: 7%; padding-top: 7%;}
            75% { transform: translateY(800px); padding-bottom: 7%; padding-top: 7%;}
            90% { transform: translateY(580px); padding: 0;}
            100% { transform: translateY(0); padding: 0;}
        }
        @keyframes paddinguplogos{
            0% {width: 200px; height: 200px; transform: translateY(0);}
            20% {width: 200px; height: 200px; transform: translateY(0);}
            40% {width: 200px; height: 200px; transform: translateY(0);}
            60% {width: 200px; height: 200px; transform: translateY(0);}
            80% {width: 200px; height: 200px; transform: translateY(0);}
            90% { width: 400px; height: 400px; transform: translateY(0);}
            98% { width: 1000px; height: 1000px; transform: translateY(600px);}
            100% { width: 400px; height: 400px; transform: translateY(0);}
        }
        @keyframes makeSlideWrapContentHigher {
            0% { height: 85%;}
            50% { height: 100%;}
            70% { height: 100%;}
            75% { height: 100%;}
            80% { height: 85%;}
            100% { height: 85%;}
        }
        @keyframes makeImagesBigger {
            0% {transform: scale(1);}
            20% {transform: scale(1);}
            25% {transform: scale(1);}
            45% {transform: scale(1);}
            50% {transform: scale(1.2);}
            70% {transform: scale(1.2);}
            75% {transform: scale(1.2);}
            90% {transform: scale(1);}
            100% {transform: scale(1);}
        }
        #roundName{
            width: 100%;
            height: 50px;
            padding-top: 30px;
            text-shadow: black 0px 0px 15px;
            /* background-color: #cccccc3a; */
            /* background-color: tomato; */
            font-size: 3em;
            font-weight: 700;
            font-family: Arial, Helvetica, sans-serif; 
            text-align: center;
            color: white;
            text-transform: uppercase;
            margin-bottom: 50px;
        }
        .logos{
            margin-top: 50px;
            width: 100%;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logos>img{
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: -30px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div id="slidesWrap" class="slides-wrap">
            <h2 id="roundName"></h2>
            <div class="slide">
                <div class="slide-wrap-content" id="slideWrapContent1" style="background-color: var(--tim-a);">
                    <div class="slideImage">
                        <img class="slideImageIMG" src="/assets/img/tim_a_default.png" alt="">
                    </div>
                    <p id="slide1Content"></p>
                </div>
                <div class="slide-wrap-content" id="slideWrapContent2" style="background-color: var(--tim-b);">
                    <div class="slideImage">
                        <img class="slideImageIMG" src="/assets/img/tim_b_default.png" alt="">
                    </div>
                    <p id="slide2Content"></p>
                </div>
            </div>
            <div class="logos" id="logos">
                <img id="logo" src="/assets/img/logo.png" alt="">
            </div>
        </div>

        <!-- <div class="button" style="margin-top: 90%;">
            <button class="start-animation" onclick="startAnimation()">&#9654;</button>
            <button class="stop-animation"   onclick="stopAnimation()">&#10006;</button>
        </div> -->
    </div>

    <script>

        let roundname = '';
        let playername1 = '';
        let playername2 = '';
        try {
            roundname = JSON.parse(localStorage.getItem('roundName')).name;
        } catch (e) {}
        try {
            playername1 = JSON.parse(localStorage.getItem('playername1')).name;
        } catch (e) {}
        try {
            playername2 = JSON.parse(localStorage.getItem('playername2')).name;
        } catch (e) {}

        document.getElementById('roundName').innerHTML = roundname || '';
        document.getElementById('slide1Content').innerHTML = playername1 || '';
        document.getElementById('slide2Content').innerHTML = playername2 || '';

        setInterval(() => {
            if(localStorage.getItem('refresh_other_pages') === 'true') {
                localStorage.setItem('refresh_other_pages', 'false');
                location.reload();
            }
        }, 500);
         setInterval(() => {
            if(localStorage.getItem('startAnimation') === 'false' && localStorage.getItem('refresh_other_pages') === 'true') {
                localStorage.setItem('refresh_other_pages', 'false');
                stopAnimation();
                location.reload();
            }
        }, 500);
        if(localStorage.getItem('startAnimation') === 'true') {
            setInterval(() => {
                startAnimation();
            }, 500);
            console.log('start animation');
        }
        if(localStorage.getItem('startAnimation') === 'false') {
            stopAnimation();
            console.log('stop animation');
        }
        else {
            stopAnimation();
        }

        function startAnimation() {
            document.getElementById('slidesWrap').classList.add('slides-animation');
            document.getElementById('logo').classList.add('paddinguplogos');
            document.getElementById('slideWrapContent1').classList.add('makeSlideWrapContentHigher');
            document.getElementById('slideWrapContent2').classList.add('makeSlideWrapContentHigher');
            Array.from(document.getElementsByClassName('slideImageIMG')).forEach(img => img.classList.add('makeImagesBigger'));
        }

        function stopAnimation() {
            const slidesWrap = document.getElementById('slidesWrap');
            slidesWrap.classList.remove('slides-animation');
            document.getElementById('logo').classList.remove('paddinguplogos');
            // Force reflow to reset the animation
            void slidesWrap.offsetWidth;
        }

    </script>
</body>
</html>
